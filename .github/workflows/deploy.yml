name: Deploy to GitHub Pages
run-name: ${{ github.event.inputs.cms_event && format('CMS {0}', github.event.inputs.cms_event) || 'Deploy source update' }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cms_event:
        description: Verified publishing event ID
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Report deployment started
        if: inputs.cms_event != ''
        env:
          CMS_EVENT: ${{ inputs.cms_event }}
          DEPLOY_CALLBACK_SECRET: ${{ secrets.DEPLOY_CALLBACK_SECRET }}
        run: node scripts/report-deployment.mjs building
      - name: Install dependencies
        run: npm ci
      - name: Optimize images
        run: npm run optimize-images -- --replace
      - name: Build
        env:
          PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always() && github.event.inputs.cms_event != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Report verified public deployment
        env:
          CMS_EVENT: ${{ inputs.cms_event }}
          DEPLOY_CALLBACK_SECRET: ${{ secrets.DEPLOY_CALLBACK_SECRET }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            node scripts/report-deployment.mjs complete
          else
            node scripts/report-deployment.mjs failed
          fi
